# Minimal Linux profile: nvim, tmux, herdr, lazygit, git, fish + CLI utilities.
# Deliberately skips: karabiner, skhd, sublime, kitty, vscode, k9s, casks.
#
# Usage (from repo root):
#   ./install.linux
- defaults:
    link:
      relink: true
      create: true
      force: true

- clean:
    '~/':
        force: true
    '~/.config':
        force: true

- link:
    # editor
    ~/.config/nvim: nvim/
    # multiplexers
    ~/.tmux.conf: .tmux.conf
    ~/.config/herdr/config.toml: herdr/config.toml
    # git
    ~/.gitconfig: .gitconfig
    ~/.gitignore_global: .gitignore
    ~/.config/lazygit/config.yml: lazygit/config.yml
    # shell (linux-specific, mac-only bits stripped)
    ~/.config/fish/config.fish: linux/fish/config.fish
    ~/.config/fish/aliases.fish: linux/fish/aliases.fish
    # helper scripts used by tmux bindings
    ~/.local/bin/session.sh: scripts/session.sh

- shell:
  - [git submodule update --init --recursive dotbot, Installing dotbot submodule]
  - command: touch ~/.config/fish/private.fish
    description: Ensuring fish private.fish exists
